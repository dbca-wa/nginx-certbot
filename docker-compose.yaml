services:
  nginx:
    image: ghcr.io/dbca-wa/nginx-sigsci:1.30.4
    ports:
      - mode: host
        protocol: tcp
        published: 80
        target: 80
      - mode: host
        protocol: tcp
        published: 443
        target: 443
      - mode: host
        protocol: tcp
        published: 10246
        target: 10246
    # Healthcheck relies on Nginx configuration for endpoint.
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:10246/healthz']
      start_period: 10s
      interval: 5s
      timeout: 1s
      retries: 5
    volumes:
      - /var/nginx-etc/letsencrypt:/etc/letsencrypt
      - /var/nginx-etc/nginx:/etc/nginx:ro
      - nginx-process:/var/run
    environment:
      - TZ=Australia/Perth
    logging:
      driver: fluentd
      options:
        fluentd-address: 'localhost:24224'
        tag: 'nginx.access'
  sigsci:
    image: ghcr.io/dbca-wa/nginx-sigsci:1.30.4
    # https://docs.fastly.com/en/ngwaf/installing-the-agent#start-the-agent
    command: sigsci-agent --log-out=stdout
    volumes:
      - /var/nginx-etc/sigsci:/etc/sigsci
      - nginx-process:/var/run
    environment:
      - TZ=Australia/Perth
    healthcheck:
      test: ['CMD', 'sigsci-agent', '--usage']
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 3
  certbot-cloudflare:
    image: ghcr.io/dbca-wa/certbot-dns-multi
    volumes:
      - /var/nginx-etc/letsencrypt:/etc/letsencrypt
      - /var/nginx-etc/letsencrypt/secrets/cloudflare.ini:/secrets/multi.ini
      - letsencrypt-log:/var/log/letsencrypt
    environment:
      - TZ=Australia/Perth
      - EMAIL=asi@dbca.wa.gov.au
      - DOMAINS=dbca.wa.gov.au,*.dbca.wa.gov.au,aspectsofkingspark.com.au,*.aspectsofkingspark.com.au,conservation.wa.gov.au,*.conservation.wa.gov.au,gorgon-ncb.org.au,*.gorgon-ncb.org.au,lan.fyi,*.lan.fyi,perthzoo.wa.gov.au,*.perthzoo.wa.gov.au,bgpa.wa.gov.au,*.bgpa.wa.gov.au,dpaw.wa.gov.au,*.dpaw.wa.gov.au,perthzoo.com.au,*.perthzoo.com.au,*.bdr.wa.gov.au,*.bio.wa.gov.au,bdr.wa.gov.au,bio.wa.gov.au,*.kingsparkguides.org.au,kingsparkguides.org.au
    healthcheck:
      test: ['CMD', 'certbot', '--help']
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 3
    entrypoint: ["tail", "-f", "/dev/null"]
  certbot-azure:
    image: ghcr.io/dbca-wa/certbot-dns-multi
    volumes:
      - /var/nginx-etc/letsencrypt:/etc/letsencrypt
      - /var/nginx-etc/letsencrypt/secrets/azure.ini:/secrets/azure.ini
      - letsencrypt-log:/var/log/letsencrypt
    environment:
      - TZ=Australia/Perth
      - EMAIL=asi@dbca.wa.gov.au
      - DOMAINS=rottnestisland.com,*.rottnestisland.com
    healthcheck:
      test: ['CMD', 'certbot', '--help']
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 3
    entrypoint: ["tail", "-f", "/dev/null"]
  fluentd:
    image: fluentd:v1.19-debian-1
    ports:
      - 24224:24224
    volumes:
      - /var/nginx-etc/fluentd:/fluentd/etc
      - fluentd-log:/fluentd/log
    environment:
      - TZ=Australia/Perth
    healthcheck:
      test: ['CMD', 'fluentd', '--dry-run', '-c', '/fluentd/etc/fluent.conf']
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 3
  log-shipper:
    image: mcr.microsoft.com/azure-cli:2.85.0
    volumes:
      - fluentd-log:/fluentd/log:ro
    environment:
      - TZ=Australia/Perth
    env_file: .env.log-shipper
    # Required .env.log-shipper values: HOSTNAME, AZURE_STORAGE_CONNECTION_STRING
    entrypoint: /bin/bash -c
    command:
      [
        'while true; do az storage blob upload-batch --connection-string $$AZURE_STORAGE_CONNECTION_STRING --destination access-logs-json/$$HOSTNAME --source /fluentd/log --pattern "*.json" --no-progress --only-show-errors --overwrite false --validate-content; sleep 300; done',
      ]

volumes:
  nginx-process:
  fluentd-log:
  letsencrypt-log:
